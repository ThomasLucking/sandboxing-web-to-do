<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/todo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web todolist project</title>
  </head>
  <body>
    <main>
      <h1>Web todolist app</h1>
      <p id="todo-error" hidden></p>
      <div class="todo-form">
        <input id="todo-input" type="text" placeholder="What needs to be done?" />
        <input id="todo-date-input" type="date" />
        <button id="add-todo-button" type="button">Add</button>
      </div>
      <ul id="todo-elements"></ul>
      <button id="delete-all" type="button">Delete All</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
