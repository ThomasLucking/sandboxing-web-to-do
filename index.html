<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/todo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web todolist project</title>
  </head>
  <body>
    <p id="overdue-message" hidden></p>
    <main class="card">
      <h1>Web todolist app</h1>
      <p id="loading-indicator" hidden aria-live="polite">Loading…</p>
      <p id="todo-error" hidden></p>
      <div class="todo-form">
        <input id="todo-input" type="text" placeholder="What needs to be done?" />
        <input id="todo-date-input" type="date" />
        <select id="todo-category-select">
          <option value="">No category</option>
        </select>
        <button id="add-todo-button" type="button">Add</button>
      </div>
      <input
        id="todo-search-input"
        type="search"
        placeholder="Search todos…"
      />
      <ul id="todo-elements"></ul>
      <button id="delete-all" type="button">Delete All</button>
    </main>
    <section class="card categories-section">
      <h2>Categories</h2>
      <p id="category-error" hidden></p>
      <div class="category-form">
        <input id="category-name-input" type="text" placeholder="Category name" />
        <input id="category-color-input" type="color" value="#4f46e5" />
        <button id="add-category-button" type="button">Add Category</button>
      </div>
      <ul id="categories-elements"></ul>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
